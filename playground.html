<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Typography & Layout Playground | Mileage Master</title>
  
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/playground.css">
</head>
<body>

  <!-- Controls Panel -->
  <div class="pg-controls">
    <div class="pg-controls__header">
      <h2>Design Playground</h2>
      <p>Select a font and layout to preview.</p>
    </div>

    <div class="pg-controls__group">
      <label for="font-select">Typography (30 Fonts)</label>
      <select id="font-select"></select>
    </div>

    <div class="pg-controls__group">
      <label for="layout-select">Layout Style (10 Styles)</label>
      <select id="layout-select">
        <option value="style-1">Style 1: Cinematic Wide</option>
        <option value="style-2">Style 2: The Grid Split</option>
        <option value="style-3">Style 3: Staggered Step</option>
        <option value="style-4">Style 4: Brutalist Block</option>
        <option value="style-5">Style 5: The Overlap Outline</option>
        <option value="style-6">Style 6: Horizontal Interlock</option>
        <option value="style-7">Style 7: Symmetrical Stack</option>
        <option value="style-8">Style 8: Floating Typographic Mesh</option>
        <option value="style-9">Style 9: Diagonal Shift</option>
        <option value="style-10">Style 10: Compressed Cinematic</option>
      </select>
    </div>

    <div class="pg-controls__group">
      <label>Color Theme</label>
      <div class="pg-theme-toggles">
        <button data-theme="red-white" class="active">Red & White</button>
        <button data-theme="all-white">All White</button>
        <button data-theme="all-red">All Red</button>
      </div>
    </div>
  </div>

  <!-- Preview Area -->
  <div class="pg-preview" id="pg-preview">
    <!-- The layout styles will target these elements -->
    <div class="pg-text-container style-1 red-white" id="text-container">
      <div class="pg-brand">
        <span class="word w1">MILEAGE</span>
        <span class="word w2">MASTER</span>
      </div>
      <div class="pg-tagline">
        <span class="word w3">POWER</span>
        <span class="word w4">UNDER</span>
        <span class="word w5">THE</span>
        <span class="word w6">HOOD</span>
      </div>
    </div>
  </div>

  <script src="js/playground.js"></script>
</body>
</html>
